<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Lumid AI — Waitlist Admin</title>
<link rel="stylesheet" href="admin.css" />
</head>
<body>

  <div class="wrap">
    <div class="topline">
      <div>
        <h1>Waitlist signups</h1>
        <p class="sub">Registered emails from the Lumid AI waiting page.</p>
      </div>
      <button class="secondary" id="logoutBtn" type="button" hidden>Log out</button>
    </div>

    <div class="gate" id="gate">
      <label for="key">Admin key</label>
      <input type="password" id="key" placeholder="Paste the ADMIN_SECRET value" autocomplete="off" />
      <p class="error" id="gateError"></p>
      <button id="unlockBtn" type="button">Unlock</button>
    </div>

    <div id="app">
      <div class="toolbar">
        <p class="count" id="count"></p>
        <div style="display:flex; gap:8px;">
          <button class="secondary" id="refreshBtn" type="button">Refresh</button>
          <button class="secondary" id="csvBtn" type="button">Export CSV</button>
        </div>
      </div>
      <div id="results"></div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
