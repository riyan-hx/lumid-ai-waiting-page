<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Lumid AI — Waitlist Admin</title>
<style>
  :root {
    --brand: #02996c;
    --heading-dark: #003e42;
    --heading-light: rgba(0, 62, 66, 0.6);
    --body-gray: #48504c;
    --font-body: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #f4f8f6;
    font-family: var(--font-body);
    color: var(--heading-dark);
  }
  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }
  h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--body-gray);
    margin: 0 0 32px;
    font-size: 15px;
  }
  .gate {
    background: #ffffff;
    border: 1px solid #e7ede9;
    border-radius: 16px;
    padding: 28px;
    max-width: 420px;
    box-shadow: 0 8px 24px rgba(10, 40, 30, 0.06);
  }
  .gate label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--heading-light);
    margin-bottom: 8px;
  }
  .gate input {
    width: 100%;
    height: 44px;
    border: 1px solid #dde5e1;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 15px;
    font-family: var(--font-body);
    margin-bottom: 14px;
  }
  .gate input:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(2, 153, 108, 0.15);
  }
  button {
    height: 44px;
    padding: 0 20px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    font-family: var(--font-body);
    cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    color: #c0392b;
    font-size: 13px;
    margin: -6px 0 14px;
    display: none;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .count {
    font-size: 14px;
    color: var(--body-gray);
  }
  .count strong { color: var(--heading-dark); }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
    border: 1px solid #e7ede9;
    border-radius: 14px;
    overflow: hidden;
  }
  thead th {
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--heading-light);
    background: #f0f6f2;
    padding: 12px 16px;
    font-weight: 600;
  }
  tbody td {
    padding: 12px 16px;
    border-top: 1px solid #eef3f0;
    font-size: 14px;
  }
  tbody tr:hover { background: #fafcfb; }
  .empty, .loading {
    padding: 40px;
    text-align: center;
    color: var(--body-gray);
    background: #ffffff;
    border: 1px solid #e7ede9;
    border-radius: 14px;
  }
  #app { display: none; }
  .secondary {
    background: transparent;
    color: var(--heading-light);
    border: 1px solid #dde5e1;
  }
</style>
</head>
<body>

  <div class="wrap">
    <h1>Waitlist signups</h1>
    <p class="sub">Registered emails from the Lumid AI waiting page.</p>

    <div class="gate" id="gate">
      <label for="key">Admin key</label>
      <input type="password" id="key" placeholder="Paste the ADMIN_SECRET value" autocomplete="off" />
      <p class="error" id="gateError"></p>
      <button id="unlockBtn" type="button">Unlock</button>
    </div>

    <div id="app">
      <div class="toolbar">
        <p class="count" id="count"></p>
        <div style="display:flex; gap:8px;">
          <button class="secondary" id="refreshBtn" type="button">Refresh</button>
          <button class="secondary" id="csvBtn" type="button">Export CSV</button>
        </div>
      </div>
      <div id="results"></div>
    </div>
  </div>

  <script>
    const gate = document.getElementById('gate');
    const app = document.getElementById('app');
    const keyInput = document.getElementById('key');
    const gateError = document.getElementById('gateError');
    const unlockBtn = document.getElementById('unlockBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const csvBtn = document.getElementById('csvBtn');
    const results = document.getElementById('results');
    const countEl = document.getElementById('count');

    let currentKey = sessionStorage.getItem('lumid_admin_key') || '';
    let currentRows = [];

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    function renderRows(rows) {
      currentRows = rows;
      countEl.innerHTML = `<strong>${rows.length}</strong> signup${rows.length === 1 ? '' : 's'}`;

      if (!rows.length) {
        results.innerHTML = '<div class="empty">No signups yet.</div>';
        return;
      }

      const body = rows
        .map(
          (r) => `
            <tr>
              <td>${escapeHtml(r.email)}</td>
              <td>${escapeHtml(r.source || '—')}</td>
              <td>${new Date(r.created_at).toLocaleString()}</td>
            </tr>`
        )
        .join('');

      results.innerHTML = `
        <table>
          <thead><tr><th>Email</th><th>Source</th><th>Registered</th></tr></thead>
          <tbody>${body}</tbody>
        </table>`;
    }

    async function loadSubscribers(key) {
      results.innerHTML = '<div class="loading">Loading…</div>';
      const res = await fetch('/api/subscribers', {
        headers: { 'x-admin-secret': key },
      });
      const data = await res.json();

      if (!res.ok || !data.ok) {
        throw new Error(data.error || `Request failed (${res.status})`);
      }
      renderRows(data.subscribers || []);
    }

    async function unlock() {
      const key = keyInput.value.trim();
      if (!key) return;

      unlockBtn.disabled = true;
      gateError.style.display = 'none';

      try {
        await loadSubscribers(key);
        currentKey = key;
        sessionStorage.setItem('lumid_admin_key', key);
        gate.style.display = 'none';
        app.style.display = 'block';
      } catch (err) {
        gateError.textContent = err.message === 'Unauthorized' ? 'Wrong admin key.' : err.message;
        gateError.style.display = 'block';
      } finally {
        unlockBtn.disabled = false;
      }
    }

    function csvEscape(value) {
      const s = String(value ?? '');
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }

    function downloadCsv() {
      const header = ['email', 'source', 'created_at'];
      const lines = [header.join(',')].concat(
        currentRows.map((r) => [csvEscape(r.email), csvEscape(r.source), csvEscape(r.created_at)].join(','))
      );
      const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'lumid-waitlist.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    unlockBtn.addEventListener('click', unlock);
    keyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlock();
    });
    refreshBtn.addEventListener('click', () => loadSubscribers(currentKey).catch((err) => alert(err.message)));
    csvBtn.addEventListener('click', downloadCsv);

    // If a key is already remembered for this browser tab session, skip the gate.
    if (currentKey) {
      loadSubscribers(currentKey)
        .then(() => {
          gate.style.display = 'none';
          app.style.display = 'block';
        })
        .catch(() => {
          sessionStorage.removeItem('lumid_admin_key');
        });
    }
  </script>
</body>
</html>
